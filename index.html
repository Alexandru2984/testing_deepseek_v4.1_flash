<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0a0c0f" />
  <meta
    name="description"
    content="A fast, private JSON formatter, minifier and validator. Everything runs locally in your browser."
  />
  <title>JSON Formatter &amp; Validator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <span>{</span><span>}</span>
        </div>
        <div class="brand-copy">
          <h1>JSON Formatter <span class="brand-amp">&amp;</span> Validator</h1>
          <p>Format, minify and validate JSON in a clean, focused workspace.</p>
        </div>
      </div>

      <div class="privacy-badge">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="4" y="10" width="16" height="11" rx="2.5" />
          <path d="M8 10V7a4 4 0 0 1 8 0v3" />
        </svg>
        <span>100% local</span>
      </div>
    </header>

    <main class="main">
      <div class="toolbar" role="group" aria-label="JSON actions">
        <div class="toolbar-group">
          <button
            id="formatBtn"
            class="btn btn-primary"
            type="button"
            aria-keyshortcuts="Control+Enter Meta+Enter"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 3H7a2 2 0 0 0-2 2v4a2 2 0 0 1-2 2 2 2 0 0 1 2 2v4a2 2 0 0 0 2 2h1" />
              <path d="M16 3h1a2 2 0 0 1 2 2v4a2 2 0 0 0 2 2 2 2 0 0 0-2 2v4a2 2 0 0 1-2 2h-1" />
            </svg>
            <span>Format</span>
            <kbd class="btn-kbd" id="formatShortcut">Ctrl ↵</kbd>
          </button>

          <button id="minifyBtn" class="btn" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M9 3v6H3" />
              <path d="M15 21v-6h6" />
              <path d="m3 9 6-6" />
              <path d="m21 15-6 6" />
            </svg>
            <span>Minify</span>
          </button>

          <button id="validateBtn" class="btn" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="9" />
              <path d="m8.4 12.2 2.4 2.4 4.8-5" />
            </svg>
            <span>Validate</span>
          </button>
        </div>

        <div class="toolbar-group toolbar-group-end">
          <button id="exampleBtn" class="btn btn-ghost" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z" />
              <path d="M14 3v5h5" />
              <path d="M9 13h6M9 17h4" />
            </svg>
            <span>Load example</span>
          </button>

          <button id="clearBtn" class="btn btn-ghost" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 7h16" />
              <path d="M10 11v6M14 11v6" />
              <path d="M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13" />
              <path d="M9 7V4h6v3" />
            </svg>
            <span>Clear</span>
          </button>
        </div>
      </div>

      <div class="workspace">
        <section class="panel" id="inputPanel" aria-labelledby="inputTitle">
          <header class="panel-head">
            <h2 class="panel-title" id="inputTitle">
              <span class="panel-dot panel-dot-input" aria-hidden="true"></span>
              Input
            </h2>
            <div class="panel-meta">
              <span id="inputMeta" class="meta-text">1 line · 0 chars</span>
            </div>
          </header>

          <div class="editor">
            <div class="gutter" id="inputGutter" aria-hidden="true"></div>
            <div class="editor-area">
              <label class="sr-only" for="inputJson">JSON input</label>
              <textarea
                id="inputJson"
                class="code-input"
                spellcheck="false"
                autocomplete="off"
                autocapitalize="off"
                autocorrect="off"
                wrap="off"
                aria-describedby="status"
                placeholder="Paste JSON here…&#10;&#10;Or load an example to get started."
              ></textarea>
            </div>
          </div>
        </section>

        <div class="status" id="status" data-state="idle" role="status" aria-live="polite" aria-atomic="true">
          <span class="status-icon" aria-hidden="true">
            <svg class="icon-idle" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="9" />
              <path d="M12 11v5M12 8h.01" />
            </svg>
            <svg class="icon-success" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="9" />
              <path d="m8.4 12.2 2.4 2.4 4.8-5" />
            </svg>
            <svg class="icon-error" viewBox="0 0 24 24">
              <path d="M10.3 4.1 2.5 18a2 2 0 0 0 1.7 3h15.6a2 2 0 0 0 1.7-3L13.7 4.1a2 2 0 0 0-3.4 0Z" />
              <path d="M12 9v4M12 17h.01" />
            </svg>
          </span>

          <div class="status-copy">
            <p class="status-title" id="statusTitle">Ready when you are</p>
            <p class="status-detail">
              <span id="statusDetail">Paste JSON, then press Format or use the keyboard shortcut.</span>
              <span class="status-location" id="statusLocation" hidden></span>
            </p>
          </div>

          <div class="status-shortcut" aria-hidden="true">
            <kbd class="js-mod-key">Ctrl</kbd><span>+</span><kbd>Enter</kbd>
          </div>
        </div>

        <section class="panel" id="outputPanel" aria-labelledby="outputTitle">
          <header class="panel-head">
            <h2 class="panel-title" id="outputTitle">
              <span class="panel-dot panel-dot-output" aria-hidden="true"></span>
              Output
              <span class="mode-chip" id="outputMode" hidden>Formatted</span>
            </h2>
            <div class="panel-meta">
              <span
                class="stale-chip"
                id="staleChip"
                title="The input has changed since this output was created."
                hidden
              >Out of date</span>
              <span id="outputMeta" class="meta-text" hidden></span>
              <button id="copyBtn" class="btn btn-small" type="button" disabled>
                <svg class="icon-copy" viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="9" y="9" width="11" height="11" rx="2" />
                  <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
                </svg>
                <svg class="icon-check" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="m5 12.5 4.5 4.5L19 7" />
                </svg>
                <span id="copyLabel">Copy</span>
              </button>
            </div>
          </header>

          <div class="editor">
            <div class="gutter" id="outputGutter" aria-hidden="true"></div>
            <div class="editor-area">
              <label class="sr-only" for="outputJson">Formatted JSON output</label>
              <textarea
                id="outputJson"
                class="code-input"
                readonly
                spellcheck="false"
                wrap="off"
                placeholder="Formatted JSON will appear here."
              ></textarea>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <div class="sr-only" id="announcer" aria-live="polite" aria-atomic="true"></div>

  <noscript>
    <p class="noscript">JavaScript is required to format and validate JSON.</p>
  </noscript>

  <script src="script.js"></script>
</body>
</html>
